<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 450px;
      min-height: 550px;
      padding: 15px;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    h2 {
      color: #333;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ai-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }
    .section {
      margin-bottom: 20px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      font-size: 14px;
      transition: all 0.3s;
    }
    button:hover {
      background: #45a049;
      transform: translateY(-1px);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button.analyze {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    button.analyze:hover {
      background: linear-gradient(135deg, #5568d3 0%, #6a3f91 100%);
    }
    button.red {
      background: #f44336;
    }
    button.red:hover {
      background: #da190b;
    }
    #imageList {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      background: white;
      border-radius: 6px;
    }
    .image-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #eee;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .image-item:hover {
      background: #f5f5f5;
      border-color: #667eea;
    }
    .image-item.low-quality {
      border-left: 3px solid #f44336;
    }
    .image-item.high-quality {
      border-left: 3px solid #4CAF50;
    }
    .image-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      margin-right: 12px;
      border-radius: 4px;
    }
    .image-info {
      flex: 1;
      font-size: 12px;
    }
    .quality-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
      margin-left: 5px;
    }
    .low-quality-badge {
      background: #ffebee;
      color: #c62828;
    }
    .high-quality-badge {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .confidence {
      color: #666;
      font-size: 11px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    #status {
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      text-align: center;
      font-weight: 500;
    }
    .success {
      background: #d4edda;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: bold;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin: 10px 0;
      font-size: 13px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #667eea;
    }
    .stat-label {
      color: #666;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h2>
    AI Image Replacer
    <span class="ai-badge">AI-POWERED</span>
  </h2>
  
  <div class="section">
    <button id="analyzeImages" class="analyze">🔍 Анализировать изображения с AI</button>
    <div id="progressBar" style="display: none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill">0%</div>
      </div>
    </div>
    <div class="stats" id="stats" style="display: none;">
      <div class="stat-item">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">Всего</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="lowQualityCount" style="color: #f44336;">0</div>
        <div class="stat-label">Низкое качество</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="highQualityCount" style="color: #4CAF50;">0</div>
        <div class="stat-label">Высокое качество</div>
      </div>
    </div>
  </div>

  <div class="section">
    <label>Найденные изображения низкого качества:</label>
    <div id="imageList"></div>
  </div>

  <div class="section">
    <label for="replaceUrl">URL изображения для замены:</label>
    <input type="text" id="replaceUrl" placeholder="https://example.com/high-quality-image.jpg">
    <div>
      <button id="replaceSelected">✓ Заменить все низкокачественные</button>
      <button id="restoreOriginal" class="red">↺ Восстановить оригиналы</button>
    </div>
  </div>

  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
